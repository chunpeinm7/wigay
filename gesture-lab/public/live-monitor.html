<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM 即時動作測試</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8eaf0;
    --muted: #8b91a3;
    --accent: #4f8cff;
    --raw: #ff6b6b;
    --smooth: #4f8cff;
    --ok: #33c37d;
    --bad: #ff5a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 18px;
  }
  .bar input {
    background: #0d0f14; border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 13px; width: 160px;
  }
  .bar button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  .bar button:hover { opacity: 0.9; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-left: auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }

  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }

  canvas { width: 100%; height: 260px; display: block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  .pred-label { font-size: 26px; font-weight: 700; margin-bottom: 14px; text-align: center; }
  .pred-label.empty { color: var(--muted); }
  .prob-row { margin-bottom: 12px; }
  .prob-row .name { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .prob-track { background: #0d0f14; border-radius: 6px; height: 10px; overflow: hidden; }
  .prob-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .prob-row.top .prob-fill { background: var(--ok); }
  .err { color: var(--bad); font-size: 12px; margin-top: 10px; }

  .calib-bar {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 18px;
    display: none;
  }
  .calib-bar.show { display: block; }
  .calib-bar.calibrating { border-color: var(--accent); }
  .calib-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .calib-track { flex: 1; background: #0d0f14; border-radius: 6px; height: 8px; overflow: hidden; }
  .calib-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; width: 0%; }
  .calib-bar button {
    background: #2a2e38; color: var(--text); border: none; border-radius: 6px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; margin-left: 8px;
  }
  .calib-bar button:hover { opacity: 0.85; }
</style>
</head>
<body>
  <h1>LSTM 即時動作測試</h1>
  <div class="sub">連上 ESP32-S3 後，即時顯示 CSI 波型，並用訓練好的 LSTM 模型判斷目前動作最接近 empty_room / squat / wave 哪一個</div>

  <div class="bar">
    <input id="hostInput" placeholder="ESP32 位址，例如 172.20.10.11">
    <button id="connectBtn">連線</button>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">未連線</span></div>
  </div>

  <div class="calib-bar" id="calibBar">
    <div class="calib-row" id="calibratingRow">
      <span>🧭 現場校準中，請保持安靜、不要動…</span>
      <div class="calib-track"><div class="calib-fill" id="calibFill"></div></div>
    </div>
    <div class="calib-row" id="calibDoneRow" style="display:none">
      <span id="calibDoneText"></span>
      <button id="recalibrateBtn">重新校準</button>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>即時波型</h2>
      <canvas id="chart" width="800" height="260"></canvas>
      <div class="legend">
        <span><span class="swatch" style="background:var(--raw)"></span>Raw Score</span>
        <span><span class="swatch" style="background:var(--smooth)"></span>Smoothed Score</span>
      </div>
    </div>

    <div class="panel">
      <h2>LSTM 判斷結果</h2>
      <div class="pred-label empty" id="predLabel">等待資料…</div>
      <div id="probs"></div>
      <div class="err" id="errText"></div>
    </div>
  </div>

<script>
const CLASSES = ["empty_room", "squat", "wave"];
const EMOJI = {empty_room: "🏠 空房間", squat: "🏋 蹲下", wave: "👋 揮手"};

const hostInput = document.getElementById("hostInput");
const connectBtn = document.getElementById("connectBtn");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const predLabel = document.getElementById("predLabel");
const probsEl = document.getElementById("probs");
const errText = document.getElementById("errText");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const calibBar = document.getElementById("calibBar");
const calibratingRow = document.getElementById("calibratingRow");
const calibDoneRow = document.getElementById("calibDoneRow");
const calibFill = document.getElementById("calibFill");
const calibDoneText = document.getElementById("calibDoneText");
const recalibrateBtn = document.getElementById("recalibrateBtn");

function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * ratio;
  canvas.height = h * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

function drawChart(history) {
  resizeCanvas();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  if (!history.length) return;

  const allVals = history.flatMap(p => [p.raw, p.smoothed]);
  let min = Math.min(...allVals), max = Math.max(...allVals);
  if (max - min < 0.01) { max += 0.5; min -= 0.5; }
  const pad = (max - min) * 0.1;
  min -= pad; max += pad;

  const x = i => (i / Math.max(1, history.length - 1)) * w;
  const y = v => h - ((v - min) / (max - min)) * h;

  // grid
  ctx.strokeStyle = "#242835";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const gy = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
  }

  const plot = (key, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    history.forEach((p, i) => {
      const px = x(i), py = y(p[key]);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
  };
  plot("raw", getComputedStyle(document.documentElement).getPropertyValue("--raw").trim());
  plot("smoothed", getComputedStyle(document.documentElement).getPropertyValue("--smooth").trim());
}

function renderProbs(prediction) {
  if (!prediction) {
    predLabel.textContent = "等待資料…";
    predLabel.classList.add("empty");
    probsEl.innerHTML = "";
    return;
  }
  predLabel.classList.remove("empty");
  predLabel.textContent = EMOJI[prediction.label] || prediction.label;

  const top = Object.entries(prediction.probs).sort((a, b) => b[1] - a[1])[0][0];
  probsEl.innerHTML = CLASSES.map(cls => {
    const p = (prediction.probs[cls] || 0) * 100;
    const isTop = cls === top;
    return `<div class="prob-row ${isTop ? "top" : ""}">
      <div class="name"><span>${EMOJI[cls] || cls}</span><span>${p.toFixed(1)}%</span></div>
      <div class="prob-track"><div class="prob-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join("");
}

function renderCalibration(s) {
  if (!s.live) {
    calibBar.classList.remove("show");
    return;
  }
  calibBar.classList.add("show");
  if (s.calibrating) {
    calibBar.classList.add("calibrating");
    calibratingRow.style.display = "flex";
    calibDoneRow.style.display = "none";
    calibFill.style.width = `${(s.calibration_progress * 100).toFixed(0)}%`;
  } else {
    calibBar.classList.remove("calibrating");
    calibratingRow.style.display = "none";
    calibDoneRow.style.display = "flex";
    const model = s.model_baseline != null ? s.model_baseline.toFixed(4) : "—";
    const live = s.live_baseline != null ? s.live_baseline.toFixed(4) : "—";
    calibDoneText.textContent = `已校準：現場基準 ${live} → 對齊訓練基準 ${model}`;
  }
}

async function poll() {
  try {
    const res = await fetch("/api/state");
    const s = await res.json();
    dot.classList.toggle("on", s.live);
    const waitingForCalibration = s.live && s.calibrating;
    const deviceCalibrating = s.live && s.device_calibrating && !s.history.length;
    if (s.live) {
      if (deviceCalibrating) {
        statusText.textContent = `已連線 ${s.esp_host}:${s.esp_port}（ESP32 韌體校準中，請等待…）`;
      } else if (waitingForCalibration) {
        statusText.textContent = `已連線 ${s.esp_host}:${s.esp_port}（校準中）`;
      } else {
        statusText.textContent = `已連線 ${s.esp_host}:${s.esp_port}`;
      }
    } else {
      statusText.textContent = "等待資料中…";
    }
    errText.textContent = s.live ? "" : (s.error || "");
    if (document.activeElement !== hostInput) hostInput.value = s.esp_host;
    drawChart(s.history);
    renderCalibration(s);
    renderProbs(waitingForCalibration ? null : s.prediction);
  } catch (e) {
    statusText.textContent = "網頁伺服器連線失敗";
  } finally {
    setTimeout(poll, 400);
  }
}

recalibrateBtn.addEventListener("click", async () => {
  await fetch("/api/recalibrate", { method: "POST" });
});

connectBtn.addEventListener("click", async () => {
  const host = hostInput.value.trim();
  if (!host) return;
  await fetch("/api/connect", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({host})
  });
});
hostInput.addEventListener("keydown", e => { if (e.key === "Enter") connectBtn.click(); });

poll();
</script>
</body>
</html>
